<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サブスク管理</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1f2430;
    --text-sub: #6b7280;
    --accent: #4f6df5;
    --accent-dark: #3a53d0;
    --danger: #e0554f;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
    padding: 24px 16px 32px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 16px;
    font-size: 1.3rem;
    font-weight: 600;
  }
  .total-card {
    background: rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 16px;
    max-width: 420px;
    margin: 0 auto;
  }
  .total-label {
    font-size: 0.85rem;
    opacity: 0.9;
  }
  .total-amount {
    font-size: 2.2rem;
    font-weight: 700;
    margin-top: 4px;
  }
  main {
    max-width: 480px;
    margin: -16px auto 0;
    padding: 0 16px;
  }
  .panel {
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 1rem;
    margin: 0 0 16px;
  }
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .field input,
  .field select {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fafbfc;
    color: var(--text);
  }
  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--accent);
    background: #fff;
  }
  .plan-chips {
    margin-top: 8px;
  }
  .plan-chips[hidden] {
    display: none;
  }
  .plan-hint {
    font-size: 0.72rem;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .plan-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 0 6px 6px 0;
    padding: 6px 10px;
    font-size: 0.8rem;
    color: var(--accent-dark);
    background: #fff;
    border: 1px solid var(--accent);
    border-radius: 999px;
    cursor: pointer;
  }
  .plan-chip.selected {
    color: #fff;
    background: var(--accent);
  }
  button.submit {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button.submit:active {
    background: var(--accent-dark);
  }
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .list-header h2 {
    margin: 0;
    font-size: 1rem;
  }
  .count {
    font-size: 0.8rem;
    color: var(--text-sub);
  }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .item:last-child { border-bottom: none; }
  .item-main {
    min-width: 0;
  }
  .item-name {
    font-weight: 600;
    font-size: 1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-meta {
    font-size: 0.8rem;
    color: var(--text-sub);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.72rem;
    color: #fff;
    white-space: nowrap;
  }
  .item-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .item-amount {
    font-weight: 700;
    font-size: 1rem;
    white-space: nowrap;
  }
  .delete-btn {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
  }
  .empty {
    text-align: center;
    color: var(--text-sub);
    padding: 24px 0;
    font-size: 0.9rem;
  }
  .category-breakdown {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .cat-chip {
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.18);
    color: #fff;
  }
</style>
</head>
<body>

<header>
  <h1>サブスク管理</h1>
  <div class="total-card">
    <div class="total-label">今月の合計金額</div>
    <div class="total-amount" id="totalAmount">¥0</div>
    <div class="category-breakdown" id="categoryBreakdown"></div>
  </div>
</header>

<main>
  <section class="panel">
    <h2>新しく登録する</h2>
    <form id="subForm">
      <div class="field">
        <label for="name">サービス名</label>
        <input type="text" id="name" placeholder="例：Netflix" list="serviceNames" autocomplete="off" required>
        <datalist id="serviceNames"></datalist>
        <div class="plan-chips" id="planChips" hidden></div>
      </div>
      <div class="field">
        <label for="amount">金額（円）</label>
        <input type="number" id="amount" placeholder="例：1490" min="0" step="1" required>
      </div>
      <div class="field">
        <label for="day">支払い日（毎月何日）</label>
        <select id="day" required></select>
      </div>
      <div class="field">
        <label for="category">カテゴリ</label>
        <select id="category">
          <option value="動画配信">動画配信</option>
          <option value="音楽">音楽</option>
          <option value="ゲーム">ゲーム</option>
          <option value="仕事・学習">仕事・学習</option>
          <option value="健康・フィットネス">健康・フィットネス</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <button type="submit" class="submit">追加する</button>
    </form>
  </section>

  <section class="panel">
    <div class="list-header">
      <h2>登録済みの一覧</h2>
      <span class="count" id="itemCount"></span>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
  const STORAGE_KEY = 'subscriptions';

  const categoryColors = {
    '動画配信': '#e0554f',
    '音楽': '#8b5cf6',
    'ゲーム': '#22a06b',
    '仕事・学習': '#f0a020',
    '健康・フィットネス': '#0ea5b8',
    'その他': '#6b7280'
  };

  const daySelect = document.getElementById('day');
  for (let d = 1; d <= 31; d++) {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d + '日';
    daySelect.appendChild(opt);
  }

  // 料金は2026年8月時点で確認できた目安です。契約プランによって異なるため、必要に応じて修正してください。
  const knownServices = {
    'Netflix': { category: '動画配信', plans: [
      { label: '広告つきスタンダード', amount: 890 },
      { label: 'スタンダード', amount: 1590 },
      { label: 'プレミアム', amount: 2290 }
    ] },
    'Amazon Prime Video': { category: '動画配信', plans: [{ label: '月額', amount: 600 }] },
    'Disney+': { category: '動画配信', plans: [
      { label: 'スタンダード', amount: 1250 },
      { label: 'プレミアム', amount: 1670 }
    ] },
    'Hulu': { category: '動画配信', plans: [{ label: '月額', amount: 1026 }] },
    'U-NEXT': { category: '動画配信', plans: [{ label: '月額', amount: 2189 }] },
    'ABEMAプレミアム': { category: '動画配信', plans: [
      { label: '広告つき', amount: 680 },
      { label: '通常', amount: 1180 }
    ] },
    'DAZN': { category: '動画配信', plans: [{ label: 'スタンダード', amount: 4200 }] },
    'dアニメストア': { category: '動画配信', plans: [{ label: '月額', amount: 660 }] },
    'YouTube Premium': { category: '動画配信', plans: [
      { label: '個人', amount: 1280 },
      { label: '学生', amount: 780 },
      { label: 'ファミリー', amount: 2280 }
    ] },
    'Spotify': { category: '音楽', plans: [
      { label: '個人', amount: 1080 },
      { label: '学生', amount: 580 },
      { label: 'デュオ', amount: 1480 },
      { label: 'ファミリー', amount: 1880 }
    ] },
    'Apple Music': { category: '音楽', plans: [
      { label: '個人', amount: 1180 },
      { label: '学生', amount: 680 },
      { label: 'ファミリー', amount: 1980 }
    ] },
    'YouTube Music': { category: '音楽', plans: [{ label: '月額', amount: 1080 }] },
    'LINE MUSIC': { category: '音楽', plans: [
      { label: '一般（LINE STORE）', amount: 980 },
      { label: 'ファミリー', amount: 1480 }
    ] },
    'Amazon Music Unlimited': { category: '音楽', plans: [
      { label: 'Prime会員', amount: 1080 },
      { label: '非会員', amount: 1180 }
    ] },
    'Nintendo Switch Online': { category: 'ゲーム', plans: [{ label: '個人（1ヶ月）', amount: 400 }] },
    'PlayStation Plus': { category: 'ゲーム', plans: [
      { label: 'エッセンシャル', amount: 850 },
      { label: 'エクストラ', amount: 1300 },
      { label: 'プレミアム', amount: 1550 }
    ] },
    'Xbox Game Pass': { category: 'ゲーム', plans: [
      { label: 'Essential', amount: 850 },
      { label: 'Premium', amount: 1300 },
      { label: 'Ultimate', amount: 1550 }
    ] },
    'Apple Arcade': { category: 'ゲーム', plans: [{ label: '月額', amount: 900 }] },
    'Microsoft 365': { category: '仕事・学習', plans: [
      { label: 'Personal', amount: 2130 },
      { label: 'Family', amount: 2740 }
    ] },
    'Adobe Creative Cloud': { category: '仕事・学習', plans: [
      { label: 'Standard', amount: 6480 },
      { label: 'Pro', amount: 9080 }
    ] },
    'ChatGPT Plus': { category: '仕事・学習', plans: [{ label: '月額', amount: 3000 }] },
    'Netlify': { category: '仕事・学習', plans: [{ label: 'Pro（目安・$20、為替により変動）', amount: 3140 }] },
    'Vercel': { category: '仕事・学習', plans: [{ label: 'Pro（目安・$20、為替により変動）', amount: 3100 }] },
    'GitHub Copilot': { category: '仕事・学習', plans: [
      { label: 'Pro（目安・$10）', amount: 1570 },
      { label: 'Pro+（目安・$39）', amount: 6100 }
    ] },
    'Cloudflare': { category: '仕事・学習', plans: [{ label: 'Pro（目安・$20、為替により変動）', amount: 3000 }] },
    'Supabase': { category: '仕事・学習', plans: [{ label: 'Pro（目安・$25、為替により変動）', amount: 3900 }] },
    'Figma': { category: '仕事・学習', plans: [
      { label: 'Professional 月払い', amount: 3000 },
      { label: 'Professional 年払い（月換算）', amount: 2400 }
    ] },
    'Canva Pro': { category: '仕事・学習', plans: [
      { label: '月払い', amount: 1180 },
      { label: '年払い（月換算）', amount: 691 }
    ] },
    'Claude Pro': { category: '仕事・学習', plans: [{ label: '月額', amount: 3300 }] },
    'Google One': { category: '仕事・学習', plans: [
      { label: '200GB', amount: 440 },
      { label: '2TB', amount: 1450 }
    ] },
    'iCloud+': { category: '仕事・学習', plans: [
      { label: '50GB', amount: 180 },
      { label: '200GB', amount: 540 },
      { label: '2TB', amount: 1800 }
    ] },
    'Notion': { category: '仕事・学習', plans: [{ label: 'Plus', amount: 1500 }] },
    'Dropbox': { category: '仕事・学習', plans: [] },
    'Kindle Unlimited': { category: '仕事・学習', plans: [{ label: '月額', amount: 980 }] },
    'Apple One': { category: '仕事・学習', plans: [
      { label: '個人', amount: 1350 },
      { label: 'ファミリー', amount: 2500 }
    ] },
    'Google AI Pro': { category: '仕事・学習', plans: [{ label: '月額', amount: 2900 }] },
    'Google AI Plus': { category: '仕事・学習', plans: [{ label: '月額', amount: 725 }] },
    'Perplexity Pro': { category: '仕事・学習', plans: [{ label: '月額', amount: 2950 }] },
    'Midjourney': { category: '仕事・学習', plans: [{ label: 'Basic（目安）', amount: 1500 }] },
    'Apple Fitness+': { category: '健康・フィットネス', plans: [] },
    'チョコザップ': { category: '健康・フィットネス', plans: [{ label: '月額', amount: 3278 }] },
    'エニタイムフィットネス': { category: '健康・フィットネス', plans: [] },
    'コナミスポーツクラブ': { category: '健康・フィットネス', plans: [] },
    'ゴールドジム': { category: '健康・フィットネス', plans: [] },
    'カーブス': { category: '健康・フィットネス', plans: [] },
    'LAVA': { category: '健康・フィットネス', plans: [] }
  };

  const serviceNameList = document.getElementById('serviceNames');
  Object.keys(knownServices).forEach(serviceName => {
    const opt = document.createElement('option');
    opt.value = serviceName;
    serviceNameList.appendChild(opt);
  });

  const planChips = document.getElementById('planChips');
  const amountInput = document.getElementById('amount');

  function renderPlanChips(info) {
    if (!info || info.plans.length === 0) {
      planChips.hidden = true;
      planChips.innerHTML = '';
      return;
    }
    planChips.hidden = false;
    planChips.innerHTML = '<div class="plan-hint">参考価格（目安・タップで金額欄に入力）</div>' +
      info.plans.map(p => `<button type="button" class="plan-chip" data-amount="${p.amount}">${escapeHtml(p.label)} ${formatYen(p.amount)}</button>`).join('');
    if (info.plans.length === 1 && amountInput.value === '') {
      amountInput.value = info.plans[0].amount;
    }
  }

  document.getElementById('name').addEventListener('input', function () {
    const info = knownServices[this.value];
    if (info) {
      document.getElementById('category').value = info.category;
    }
    renderPlanChips(info);
  });

  planChips.addEventListener('click', function (e) {
    const btn = e.target.closest('.plan-chip');
    if (!btn) return;
    amountInput.value = btn.dataset.amount;
    this.querySelectorAll('.plan-chip').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  });

  function loadSubs() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveSubs(subs) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(subs));
  }

  function formatYen(n) {
    return '¥' + Math.round(n).toLocaleString('ja-JP');
  }

  function render() {
    const subs = loadSubs();
    const list = document.getElementById('list');
    const itemCount = document.getElementById('itemCount');
    const totalAmount = document.getElementById('totalAmount');
    const categoryBreakdown = document.getElementById('categoryBreakdown');

    itemCount.textContent = subs.length + '件';

    if (subs.length === 0) {
      list.innerHTML = '<div class="empty">まだ登録がありません。上のフォームから追加してください。</div>';
    } else {
      const sorted = [...subs].sort((a, b) => a.day - b.day);
      list.innerHTML = sorted.map(sub => {
        const color = categoryColors[sub.category] || categoryColors['その他'];
        return `
          <div class="item">
            <div class="item-main">
              <div class="item-name">${escapeHtml(sub.name)}</div>
              <div class="item-meta">
                <span class="badge" style="background:${color}">${escapeHtml(sub.category)}</span>
                <span>毎月${sub.day}日</span>
              </div>
            </div>
            <div class="item-right">
              <div class="item-amount">${formatYen(sub.amount)}</div>
              <button class="delete-btn" data-id="${sub.id}" title="削除">×</button>
            </div>
          </div>
        `;
      }).join('');
    }

    const total = subs.reduce((sum, s) => sum + Number(s.amount), 0);
    totalAmount.textContent = formatYen(total);

    const byCategory = {};
    subs.forEach(s => {
      byCategory[s.category] = (byCategory[s.category] || 0) + Number(s.amount);
    });
    categoryBreakdown.innerHTML = Object.keys(byCategory).map(cat => {
      return `<span class="cat-chip">${escapeHtml(cat)} ${formatYen(byCategory[cat])}</span>`;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('subForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const amount = document.getElementById('amount').value;
    const day = document.getElementById('day').value;
    const category = document.getElementById('category').value;

    if (!name || amount === '' || Number(amount) < 0) return;

    const subs = loadSubs();
    subs.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      name,
      amount: Number(amount),
      day: Number(day),
      category
    });
    saveSubs(subs);
    render();
    this.reset();
    renderPlanChips(null);
    document.getElementById('name').focus();
  });

  document.getElementById('list').addEventListener('click', function (e) {
    const btn = e.target.closest('.delete-btn');
    if (!btn) return;
    const id = btn.dataset.id;
    const subs = loadSubs().filter(s => s.id !== id);
    saveSubs(subs);
    render();
  });

  render();
</script>

</body>
</html>
